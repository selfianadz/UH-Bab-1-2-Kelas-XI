ri Pancasila sebagai leitstar dinamis adalah...", "o": ["Mampu memberikan solusi atas persoalan baru yang muncul di masyarakat", "Mendorong kreativitas dan inovasi generasi muda yang berkarakter kebangsaan", "Menjadi filter terhadap nilai-nilai asing agar tidak menimbulkan disorientasi bangsa", "Bersifat statis, tertutup, dan tidak menerima penafsiran operasional baru", "Mengarahkan pergerakan bangsa menuju cita-cita masyarakat adil dan makmur"], "a": 139}, {"id": 20, "q": "Ketika bangsa Indonesia menghadapi krisis kesehatan global seperti pandemi, Pancasila berfungsi sebagai leitstar dinamis dengan cara...", "o": ["Mengarahkan solidaritas gotong royong dan kebijakan negara yang mengutamakan keselamatan kemanusiaan serta keadilan sosial", "Membiarkan setiap daerah menyelesaikan krisis secara individual tanpa koordinasi pusat", "Menghentikan seluruh kegiatan musyawarah demi mempercepat keputusan sepihak", "Mengutamakan keuntungan ekonomi kelompok tertentu di atas kesehatan masyarakat", "Menolak bantuan serta kerja sama kemanusiaan dengan negara lain"], "a": 143}, {"id": 21, "q": "Urutan periodesasi pemberlakuan undang-undang dasar di Indonesia sejak kemerdekaan hingga saat ini yang tepat adalah...", "o": ["UUD 1945 – UUDS 1950 – Konstitusi RIS – UUD 1945", "UUD 1945 – Konstitusi RIS – UUDS 1950 – UUD 1945", "Konstitusi RIS – UUD 1945 – UUDS 1950 – UUD 1945", "UUD 1945 – Konstitusi RIS – UUD 1945 – UUDS 1950", "UUDS 1950 – Konstitusi RIS – UUD 1945 – UUD NRI 1945"], "a": 151}, {"id": 22, "q": "Pada periode 18 Agustus 1945 hingga 27 Desember 1949, sistem pemerintahan Indonesia mengalami perubahan dari presidensial menjadi parlementer setelah dikeluarkannya...", "o": ["Dekrit Presiden 5 Juli 1959", "Maklumat Wakil Presiden Nomor X tanggal 16 Oktober 1945", "Maklumat Pemerintah tanggal 14 November 1945", "Surat Perintah Sebelas Maret 1966", "Ketetapan MPRS Nomor XX/MPRS/1966"], "a": 159}, {"id": 23, "q": "Pada masa berlakunya Konstitusi RIS, bentuk negara Indonesia berub const save=()=>{try{localStorage.setItem('uh11',JSON.stringify(S))}catch(e){}};

$('gr').innerHTML='';S.order.forEach((x,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=(S.ans[x]!==undefined?'d ':'')+(i===S.cur?'cu':'');b.onclick=()=>{S.cur=i;save();draw();scrollTo(0,0)};$('gr').appendChild(b)})}
function go(d){S.cur=Math.min(N-1,Math.max(0,S.cur+d));save();draw();scrollTo(0,0)}
